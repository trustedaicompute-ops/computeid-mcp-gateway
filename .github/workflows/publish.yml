name: Build and publish to PyPI

# Pull requests and pushes to master: build, check and smoke-test the
# package. A pushed tag vX.Y.Z (matching the package version): the same,
# then publish to PyPI with trusted publishing (OIDC; no API token stored
# anywhere). Publishing runs in the "pypi" environment, the name registered
# as the trusted publisher on pypi.org.
on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(ls dist/*.whl | sed -E 's#^dist/[^-]+-([^-]+)-.*#\1#')
          echo "package $VERSION, tag $GITHUB_REF_NAME"
          test "v$VERSION" = "$GITHUB_REF_NAME"
      - name: Smoke test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          # The console script and `python -m` must both start a working
          # stdio MCP server: initialize, then list the tools.
          /tmp/smoke/bin/python .github/smoke_mcp.py /tmp/smoke/bin/computeid-mcp
          /tmp/smoke/bin/python .github/smoke_mcp.py /tmp/smoke/bin/python -m computeid_mcp
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/computeid-mcp
    permissions:
      id-token: write  # OIDC token for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
