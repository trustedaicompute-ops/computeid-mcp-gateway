[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "computeid-mcp"
dynamic = ["version"]
description = "ComputeID MCP server: issue, verify and revoke AgentPassports and DevicePassports from Claude and other MCP clients"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ComputeID", email = "hello@compute-id.com" }]
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.0.0,<2",  # the server uses the 1.x low-level Server API (removed in 2.0)
  "httpx>=0.24.0",
]
keywords = ["mcp", "model-context-protocol", "ai-agents", "identity", "agentpassport", "security", "computeid"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://aicomputeid.com"
Source = "https://github.com/trustedaicompute-ops/computeid-mcp-gateway"
Changelog = "https://github.com/trustedaicompute-ops/computeid-mcp-gateway/blob/master/CHANGELOG.md"

[project.scripts]
computeid-mcp = "computeid_mcp.server:run"

[tool.setuptools]
packages = ["computeid_mcp"]

[tool.setuptools.dynamic]
version = { attr = "computeid_mcp.__version__" }
